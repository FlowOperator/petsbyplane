<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#F1EEE7;}
  a{color:#E8623D;}
  a:hover{color:#c94f2f;}
</style>
</helmet>

<div style="width:100%;background:#FFFFFF;border-radius:22px;padding:18px 20px;box-shadow:0 8px 24px rgba(46,40,34,0.06);font-family:'Nunito',sans-serif;box-sizing:border-box;">

  <div style="color:#2E2822;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;">{{ title }}</div>
  <div style="color:#6B6259;font-size:12.5px;margin-top:5px;line-height:1.45;">{{ summary }}</div>

  <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-top:14px;gap:12px;">
    <div onClick="{{ toggleAccepted }}" style="display:flex;align-items:flex-start;gap:9px;cursor:pointer;">
      <div style="{{ boxStyle }}">{{ checkMark }}</div>
      <span style="color:#2E2822;font-size:12.5px;font-weight:600;line-height:1.4;white-space:nowrap;">I accept</span>
    </div>
    <a href="#" onClick="{{ toggleExpanded }}" style="color:#E8623D;font-size:12px;font-weight:700;text-decoration:none;flex-shrink:0;white-space:nowrap;">{{ linkText }}</a>
  </div>

  <sc-if value="{{ expanded }}" hint-placeholder-val="{{ false }}">
    <div style="margin-top:12px;background:#F7F4EC;border-radius:14px;padding:12px 14px;max-height:140px;overflow-y:auto;">
      <div style="color:#6B6259;font-size:11.5px;line-height:1.6;white-space:pre-wrap;">{{ fullText }}</div>
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:350,&quot;height&quot;:160},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Terms &amp; Conditions&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;summary&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;You're agreeing to our standard booking terms, including payment schedule and cancellation policy.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;linkLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;View full terms&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fullText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Full terms text goes here.&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { accepted: false, expanded: false };
  renderVals() {
    const { accepted, expanded } = this.state;
    return {
      title: this.props.title ?? 'Terms & Conditions',
      summary: this.props.summary ?? "You're agreeing to our standard booking terms, including payment schedule and cancellation policy.",
      linkText: expanded ? 'Hide full terms' : (this.props.linkLabel ?? 'View full terms'),
      fullText: this.props.fullText ?? 'Full terms text goes here.',
      expanded,
      toggleAccepted: () => this.setState({ accepted: !accepted }),
      toggleExpanded: (e) => { e.preventDefault(); this.setState({ expanded: !expanded }); },
      boxStyle: {
        width: 19, height: 19, borderRadius: 6, flexShrink: 0, marginTop: 1,
        border: accepted ? 'none' : '1.5px solid rgba(46,40,34,0.3)',
        background: accepted ? '#4C8B6B' : '#FFFFFF',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        color: '#FFFFFF', fontSize: 12, fontWeight: 700
      },
      checkMark: accepted ? '✓' : ''
    };
  }
}
</script>
</body>
</html>
