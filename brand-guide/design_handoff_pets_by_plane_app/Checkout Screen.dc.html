<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#EAE6DC;}
  a{color:#E8623D;}
  a:hover{color:#c94f2f;}
  .pbp-input3{font-family:'Nunito',sans-serif;font-size:14px;color:#2E2822;border:1.5px solid rgba(46,40,34,0.12);border-radius:14px;padding:12px 14px;background:#FFFFFF;outline:none;width:100%;box-sizing:border-box;}
  .pbp-input3::placeholder{color:#B4ACA1;}
</style>
</helmet>

<div style="width:390px;height:844px;background:#F1EEE7;position:relative;overflow:hidden;font-family:'Nunito',sans-serif;margin:0 auto;box-shadow:0 30px 80px rgba(46,40,34,0.18);display:flex;flex-direction:column;">

  <div style="padding:24px 20px 4px;flex-shrink:0;">
    <a href="Quote Booking Screen.dc.html" style="color:#6B6259;font-size:11.5px;font-weight:700;text-decoration:none;display:inline-block;margin-bottom:6px;">← Back to quote</a>
    <div style="color:#2E2822;font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:700;">Create your account</div>
    <div style="color:#6B6259;font-size:12.5px;margin-top:3px;">So you can track the journey and message your consultant</div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px;">
    <input class="pbp-input3" placeholder="Pet's name" value="Darcy" />
    <input class="pbp-input3" placeholder="Full name" />
    <input class="pbp-input3" placeholder="Email address" />
    <input class="pbp-input3" placeholder="Phone number" />
    <input class="pbp-input3" placeholder="Create a password" type="password" />

    <div style="background:#FFFFFF;border-radius:18px;padding:16px;margin-top:8px;">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;"><span style="color:#6B6259;">Route</span><span style="color:#2E2822;font-weight:700;">LHR → AMS → LAX</span></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;"><span style="color:#6B6259;">Add-ons selected</span><span style="color:#2E2822;font-weight:700;">2</span></div>
      <div style="height:1px;background:rgba(46,40,34,0.08);margin:6px 0;"></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;"><span style="color:#2E2822;font-weight:700;font-size:13.5px;">Deposit due today</span><span style="color:#2E2822;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:18px;">£405</span></div>
      <div style="color:#9A9188;font-size:11px;text-align:right;margin-top:2px;">25% of total — remainder due before collection</div>
    </div>
  </div>

  <div style="flex-shrink:0;background:#FFFFFF;border-top:1px solid rgba(46,40,34,0.08);padding:16px 20px 22px;box-shadow:0 -8px 24px rgba(46,40,34,0.06);">
    <button onClick="{{ payDeposit }}" style="width:100%;background:#EFC26C;color:#2E2822;border:none;border-radius:999px;padding:15px 0;font-family:'Nunito',sans-serif;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 8px 20px rgba(239,194,108,0.5);">Continue to payment</button>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    return { payDeposit: () => { window.location.href = 'Payment Method Screen.dc.html'; } };
  }
}
</script>
</body>
</html>
