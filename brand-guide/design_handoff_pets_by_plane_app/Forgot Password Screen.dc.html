<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#EAE6DC;}
  a{color:#E8623D;}
  a:hover{color:#c94f2f;}
  .pbp-input6{font-family:'Nunito',sans-serif;font-size:14px;color:#2E2822;border:1.5px solid rgba(46,40,34,0.12);border-radius:14px;padding:12px 14px;background:#FFFFFF;outline:none;width:100%;box-sizing:border-box;}
  .pbp-input6::placeholder{color:#B4ACA1;}
</style>
</helmet>

<div style="width:390px;height:844px;background:#F1EEE7;position:relative;overflow:hidden;font-family:'Nunito',sans-serif;margin:0 auto;box-shadow:0 30px 80px rgba(46,40,34,0.18);display:flex;flex-direction:column;">

  <div style="padding:24px 20px 4px;flex-shrink:0;">
    <a href="Sign In Screen.dc.html" style="color:#6B6259;font-size:11.5px;font-weight:700;text-decoration:none;display:inline-block;margin-bottom:6px;">← Back to sign in</a>
  </div>

  <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
  <div style="flex:1;padding:24px 24px 20px;">
    <div style="color:#2E2822;font-family:'Baloo 2',sans-serif;font-size:22px;font-weight:700;">Reset your password</div>
    <div style="color:#6B6259;font-size:13px;margin-top:8px;line-height:1.5;">Enter the email on your account and we'll send a link to reset your password.</div>
    <input class="pbp-input6" placeholder="Email address" style="margin-top:20px;" />
  </div>
  <div style="flex-shrink:0;padding:8px 24px 30px;">
    <button onClick="{{ sendLink }}" style="width:100%;background:#EFC26C;color:#2E2822;border:none;border-radius:999px;padding:15px 0;font-family:'Nunito',sans-serif;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 8px 20px rgba(239,194,108,0.5);">Send reset link</button>
  </div>
  </sc-if>

  <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;">
    <div style="width:64px;height:64px;border-radius:50%;background:rgba(232,98,61,0.12);display:flex;align-items:center;justify-content:center;margin-bottom:16px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M4 6h16v12H4z" stroke="#E8623D" stroke-width="1.7" stroke-linejoin="round"/><path d="M4 7l8 6 8-6" stroke="#E8623D" stroke-width="1.7" stroke-linejoin="round"/></svg>
    </div>
    <div style="color:#2E2822;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:18px;">Check your inbox</div>
    <div style="color:#6B6259;font-size:13px;margin-top:8px;line-height:1.5;max-width:260px;">We've sent a password reset link. It'll expire in 30 minutes.</div>
    <a href="Sign In Screen.dc.html" style="margin-top:22px;color:#E8623D;font-size:13px;font-weight:700;text-decoration:none;">Back to sign in</a>
  </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  state = { sent: false };
  renderVals() {
    const { sent } = this.state;
    return { notSent: !sent, sent, sendLink: () => this.setState({ sent: true }) };
  }
}
</script>
</body>
</html>
