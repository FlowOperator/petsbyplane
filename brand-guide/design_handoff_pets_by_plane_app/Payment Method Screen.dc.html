<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#EAE6DC;}
  a{color:#E8623D;}
  a:hover{color:#c94f2f;}
  .pbp-input7{font-family:'Nunito',sans-serif;font-size:14px;color:#2E2822;border:1.5px solid rgba(46,40,34,0.12);border-radius:14px;padding:12px 14px;background:#FFFFFF;outline:none;width:100%;box-sizing:border-box;}
  .pbp-input7::placeholder{color:#B4ACA1;}
</style>
</helmet>

<div style="width:390px;height:844px;background:#F1EEE7;position:relative;overflow:hidden;font-family:'Nunito',sans-serif;margin:0 auto;box-shadow:0 30px 80px rgba(46,40,34,0.18);display:flex;flex-direction:column;">

  <div style="padding:24px 20px 4px;flex-shrink:0;">
    <a href="Checkout Screen.dc.html" style="color:#6B6259;font-size:11.5px;font-weight:700;text-decoration:none;display:inline-block;margin-bottom:6px;">← Back</a>
    <div style="color:#2E2822;font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:700;">Payment details</div>
    <div style="color:#6B6259;font-size:12.5px;margin-top:3px;">Your card is only charged for the deposit today</div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px;">
    <input class="pbp-input7" placeholder="Name on card" />
    <input class="pbp-input7" placeholder="Card number" />
    <div style="display:flex;gap:10px;">
      <input class="pbp-input7" placeholder="MM / YY" />
      <input class="pbp-input7" placeholder="CVC" />
    </div>
    <input class="pbp-input7" placeholder="Billing postcode" />

    <div style="display:flex;align-items:center;gap:8px;margin-top:6px;color:#6B6259;font-size:12px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="10" rx="2" stroke="#6B6259" stroke-width="1.6"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#6B6259" stroke-width="1.6"/></svg>
      Payments are encrypted and processed securely
    </div>

    <div style="background:#FFFFFF;border-radius:18px;padding:16px;margin-top:8px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <span style="color:#2E2822;font-weight:700;font-size:13.5px;">Deposit due today</span>
        <span style="color:#2E2822;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:18px;">£405</span>
      </div>
      <div style="color:#9A9188;font-size:11px;text-align:right;margin-top:2px;">Remainder due before collection</div>
    </div>
  </div>

  <div style="flex-shrink:0;background:#FFFFFF;border-top:1px solid rgba(46,40,34,0.08);padding:16px 20px 22px;box-shadow:0 -8px 24px rgba(46,40,34,0.06);">
    <button onClick="{{ pay }}" style="width:100%;background:#EFC26C;color:#2E2822;border:none;border-radius:999px;padding:15px 0;font-family:'Nunito',sans-serif;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 8px 20px rgba(239,194,108,0.5);">Pay £405 deposit</button>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    return { pay: () => { window.location.href = 'Booking Confirmation Screen.dc.html'; } };
  }
}
</script>
</body>
</html>
