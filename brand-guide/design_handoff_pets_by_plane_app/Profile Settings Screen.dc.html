<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#EAE6DC;}
  a{color:#E8623D;}
  a:hover{color:#c94f2f;}
</style>
</helmet>

<div style="width:390px;height:844px;background:#F1EEE7;position:relative;overflow:hidden;font-family:'Nunito',sans-serif;margin:0 auto;box-shadow:0 30px 80px rgba(46,40,34,0.18);display:flex;flex-direction:column;">

  <div style="display:flex;align-items:center;gap:12px;padding:26px 20px 12px;flex-shrink:0;">
    <a href="Profile Screen.dc.html" style="width:38px;height:38px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(46,40,34,0.08);flex-shrink:0;text-decoration:none;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M15 5 8 12l7 7" stroke="#2E2822" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div style="color:#2E2822;font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:700;">Settings</div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:8px 20px 24px;display:flex;flex-direction:column;gap:16px;">

    <div>
      <div style="color:#6B6259;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;margin:6px 0 8px;">Notifications</div>
      <div style="background:#FFFFFF;border-radius:20px;overflow:hidden;">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(46,40,34,0.06);">
          <span style="color:#2E2822;font-size:13.5px;font-weight:600;">Journey updates</span>
          <div style="{{ toggleStyle_journey }}"><div style="{{ knobStyle_journey }}"></div></div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(46,40,34,0.06);" onClick="{{ toggleMessages }}">
          <span style="color:#2E2822;font-size:13.5px;font-weight:600;">Messages from consultant</span>
          <div style="{{ toggleStyle_messages }}"><div style="{{ knobStyle_messages }}"></div></div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;" onClick="{{ toggleMarketing }}">
          <span style="color:#2E2822;font-size:13.5px;font-weight:600;">Offers &amp; news</span>
          <div style="{{ toggleStyle_marketing }}"><div style="{{ knobStyle_marketing }}"></div></div>
        </div>
      </div>
    </div>

    <div>
      <div style="color:#6B6259;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;margin:6px 0 8px;">Account</div>
      <div style="background:#FFFFFF;border-radius:20px;overflow:hidden;">
        <a href="#" style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(46,40,34,0.06);text-decoration:none;">
          <span style="color:#2E2822;font-size:13.5px;font-weight:600;">Change password</span>
          <span style="color:#B4ACA1;font-size:14px;">›</span>
        </a>
        <a href="#" style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;text-decoration:none;">
          <span style="color:#2E2822;font-size:13.5px;font-weight:600;">Privacy &amp; terms</span>
          <span style="color:#B4ACA1;font-size:14px;">›</span>
        </a>
      </div>
    </div>

    <a href="Welcome Screen.dc.html" style="text-align:center;background:#FFFFFF;border-radius:999px;padding:13px 0;color:#2E2822;font-weight:700;font-size:14px;text-decoration:none;border:1.5px solid rgba(46,40,34,0.12);">Log out</a>
    <a href="#" style="text-align:center;color:#C0503A;font-weight:700;font-size:12.5px;text-decoration:none;">Delete my account</a>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  state = { journey: true, messages: true, marketing: false };
  toggleStyle(on) {
    return { width: 40, height: 24, borderRadius: 999, background: on ? '#E8623D' : 'rgba(46,40,34,0.15)', position: 'relative', flexShrink: 0, cursor: 'pointer' };
  }
  knobStyle(on) {
    return { width: 18, height: 18, borderRadius: '50%', background: '#FFFFFF', position: 'absolute', top: 3, left: on ? 19 : 3, transition: 'left 0.15s' };
  }
  renderVals() {
    const { journey, messages, marketing } = this.state;
    return {
      toggleStyle_journey: this.toggleStyle(journey), knobStyle_journey: this.knobStyle(journey),
      toggleStyle_messages: this.toggleStyle(messages), knobStyle_messages: this.knobStyle(messages),
      toggleStyle_marketing: this.toggleStyle(marketing), knobStyle_marketing: this.knobStyle(marketing),
      toggleMessages: () => this.setState({ messages: !messages }),
      toggleMarketing: () => this.setState({ marketing: !marketing })
    };
  }
}
</script>
</body>
</html>
