<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#EAE6DC;}
  a{color:#E8623D;}
  a:hover{color:#c94f2f;}
  .pbp-input5{font-family:'Nunito',sans-serif;font-size:14px;color:#2E2822;border:1.5px solid rgba(46,40,34,0.12);border-radius:14px;padding:12px 14px;background:#FFFFFF;outline:none;width:100%;box-sizing:border-box;}
  .pbp-input5::placeholder{color:#B4ACA1;}
</style>
</helmet>

<div style="width:390px;height:844px;background:#F1EEE7;position:relative;overflow:hidden;font-family:'Nunito',sans-serif;margin:0 auto;box-shadow:0 30px 80px rgba(46,40,34,0.18);display:flex;flex-direction:column;">

  <div style="padding:48px 24px 8px;flex-shrink:0;text-align:center;">
    <div style="color:#2E2822;font-family:'Baloo 2',sans-serif;font-size:24px;font-weight:700;">Welcome back</div>
    <div style="color:#6B6259;font-size:13px;margin-top:6px;">Sign in to see your pet's journey</div>
  </div>

  <div style="flex:1;padding:32px 24px 20px;display:flex;flex-direction:column;gap:12px;">
    <input class="pbp-input5" placeholder="Email address" />
    <input class="pbp-input5" placeholder="Password" type="password" />
    <a href="#" style="text-align:right;color:#E8623D;font-size:12px;font-weight:700;text-decoration:none;">Forgot password?</a>
  </div>

  <div style="flex-shrink:0;padding:8px 24px 30px;display:flex;flex-direction:column;gap:14px;">
    <button onClick="{{ signIn }}" style="width:100%;background:#EFC26C;color:#2E2822;border:none;border-radius:999px;padding:15px 0;font-family:'Nunito',sans-serif;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 8px 20px rgba(239,194,108,0.5);">Sign in</button>
    <div style="text-align:center;color:#6B6259;font-size:12.5px;">New here? <a href="Sign Up Screen.dc.html" style="font-weight:700;">Create an account</a></div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    return { signIn: () => { window.location.href = 'Home Screen.dc.html'; } };
  }
}
</script>
</body>
</html>
