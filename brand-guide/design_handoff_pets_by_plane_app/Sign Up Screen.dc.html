<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#EAE6DC;}
  a{color:#E8623D;}
  a:hover{color:#c94f2f;}
  .pbp-input4{font-family:'Nunito',sans-serif;font-size:14px;color:#2E2822;border:1.5px solid rgba(46,40,34,0.12);border-radius:14px;padding:12px 14px;background:#FFFFFF;outline:none;width:100%;box-sizing:border-box;}
  .pbp-input4::placeholder{color:#B4ACA1;}
</style>
</helmet>

<div style="width:390px;height:844px;background:#F1EEE7;position:relative;overflow:hidden;font-family:'Nunito',sans-serif;margin:0 auto;box-shadow:0 30px 80px rgba(46,40,34,0.18);display:flex;flex-direction:column;">

  <div style="padding:40px 24px 8px;flex-shrink:0;text-align:center;">
    <div style="color:#2E2822;font-family:'Baloo 2',sans-serif;font-size:24px;font-weight:700;">Create your account</div>
    <div style="color:#6B6259;font-size:13px;margin-top:6px;">Save your quotes and track your pet's journey</div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:28px 24px 20px;display:flex;flex-direction:column;gap:12px;">
    <button style="width:100%;background:#FFFFFF;color:#2E2822;border:1.5px solid rgba(46,40,34,0.15);border-radius:999px;padding:13px 0;font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#2E2822" d="M16.6 12.3c0-1.5.7-2.6 2-3.4-.8-1.1-2-1.7-3.5-1.8-1.5-.1-3.1.9-3.7.9-.6 0-2-.9-3.2-.9-2.4 0-5 2-5 5.8 0 1.1.2 2.3.6 3.4.5 1.5 2.4 5.2 4.4 5.1 1 0 1.7-.7 3-.7 1.3 0 1.9.7 3 .7 2 0 3.7-3.4 4.2-4.9-2.7-1.3-2.8-3.7-2.8-4.2zM14 5.3c.6-.7 1-1.7.9-2.7-.9.1-2 .6-2.6 1.3-.6.7-1.1 1.7-1 2.7 1 .1 2-.5 2.7-1.3z"/></svg>
      Continue with Apple
    </button>
    <button style="width:100%;background:#FFFFFF;color:#2E2822;border:1.5px solid rgba(46,40,34,0.15);border-radius:999px;padding:13px 0;font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.2c0-.8-.1-1.4-.2-2H12v3.9h6c-.1 1-.8 2.6-2.3 3.6l3.6 2.8c2.1-2 3.2-4.8 3.2-8.3z"/><path fill="#34A853" d="M12 23c3.1 0 5.7-1 7.6-2.8l-3.6-2.8c-1 .7-2.3 1.1-4 1.1-3.1 0-5.7-2.1-6.6-4.9l-3.7 2.9C3.4 20.6 7.4 23 12 23z"/><path fill="#FBBC05" d="M5.4 13.6c-.2-.7-.4-1.4-.4-2.1s.1-1.5.4-2.1L1.7 6.5C1 8 .5 9.6.5 11.5s.5 3.5 1.2 5l3.7-2.9z"/><path fill="#EA4335" d="M12 5c1.7 0 2.9.7 3.6 1.3l3.2-3.1C16.9 1.4 14.5.5 12 .5 7.4.5 3.4 2.9 1.7 6.5l3.7 2.9C6.3 6.6 8.9 5 12 5z"/></svg>
      Continue with Google
    </button>

    <div style="display:flex;align-items:center;gap:10px;margin:6px 0;">
      <div style="flex:1;height:1px;background:rgba(46,40,34,0.12);"></div>
      <span style="color:#9A9188;font-size:11.5px;font-weight:700;">OR</span>
      <div style="flex:1;height:1px;background:rgba(46,40,34,0.12);"></div>
    </div>

    <input class="pbp-input4" placeholder="Full name" />
    <input class="pbp-input4" placeholder="Email address" />
    <input class="pbp-input4" placeholder="Create a password" type="password" />
  </div>

  <div style="flex-shrink:0;padding:8px 24px 30px;display:flex;flex-direction:column;gap:14px;">
    <button onClick="{{ signUp }}" style="width:100%;background:#EFC26C;color:#2E2822;border:none;border-radius:999px;padding:15px 0;font-family:'Nunito',sans-serif;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 8px 20px rgba(239,194,108,0.5);">Create account</button>
    <div style="text-align:center;color:#6B6259;font-size:12.5px;">Already have an account? <a href="Sign In Screen.dc.html" style="font-weight:700;">Sign in</a></div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    return { signUp: () => { window.location.href = 'New Booking Screen.dc.html'; } };
  }
}
</script>
</body>
</html>
